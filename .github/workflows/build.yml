name: Build willow KSU + SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "FloppyKernel branch/commit (SM6125 base pre willow/ginkgo)"
        required: true
        default: "a14/flop-general"
      stock_boot_url:
        description: "URL na stock boot.img z tvojho PixelOS 17 willow buildu (nepovinne - ak das, dostanes hotovy boot.img)"
        required: false
        default: ""

# Overeny recept (lokalne zbuildene, Image.gz + KSU + SUSFS):
#   - base: FloppyKernel (ma uz manualne ksu_handle_* hooky pre non-GKI)
#   - KSU: tiann/KernelSU @ v0.9.5 (posledna verzia s non-GKI podporou; SUSFS 4.14 patch na nu sadne na 0 rejectov)
#   - kprobes hooky vypnute -> KSU ide cez manualne hooky z Floppy (non-GKI)
#   - SUSFS: simonpunk/susfs4ksu branch kernel-4.14
#   - fix_cred_rcu: Floppy ma cred.usage ako atomic_long_t, treba atomic_long_inc_not_zero
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEFCONFIG: "vendor/ginkgo-perf_defconfig"
      KERNEL_SRC: "https://github.com/FlopKernel-Series/flop_trinket-mi_kernel"
      KSU_REPO: "https://github.com/tiann/KernelSU"
      KSU_TAG: "v0.9.5"
      SUSFS_BRANCH: "kernel-4.14"
      SUSFS_MAIN_PATCH: "50_add_susfs_in_kernel-4.14.patch"
      ANYKERNEL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: Checkout tohto repozitara (scripts/, anykernel/, workflow)
        uses: actions/checkout@v4

      - name: Priprava prostredia
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex \
            git libssl-dev libncurses5-dev libelf-dev zip python3 \
            device-tree-compiler unzip wget

      - name: Stiahni kernel zdrojaky (FloppyKernel SM6125)
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_ref }}" "$KERNEL_SRC" kernel
          echo "=== verzia kernelu ==="
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' kernel/Makefile

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-willow-pos17-${{ github.run_id }}
          restore-keys: |
            ccache-willow-pos17-

      - name: Clang toolchain (Proton)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$GITHUB_WORKSPACE/clang"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -1

      - name: SUSFS do kernel stromu (fs/, include/, 50_add patch)
        working-directory: kernel
        run: |
          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          patch -p1 --batch --fuzz=3 -N < "../susfs4ksu/kernel_patches/$SUSFS_MAIN_PATCH" || \
            echo "VAROVANIE: niektore 50_add hunky nesadli, dolepujem rucne"
          if ! grep -q "CONFIG_KSU_SUSFS" include/linux/mount.h; then
            python3 "$GITHUB_WORKSPACE/scripts/fix_mount_h.py"
          fi
          if [ -f fs/proc/task_mmu.c ] && ! grep -q "susfs_def.h" fs/proc/task_mmu.c; then
            python3 "$GITHUB_WORKSPACE/scripts/fix_task_mmu.py"
          fi
          rm -f fs/proc/task_mmu.c.rej include/linux/mount.h.rej 2>/dev/null || true

      - name: KernelSU (tiann v0.9.5) do drivers/kernelsu + vypni kprobe hooky
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          git clone "$KSU_REPO" drivers/kernelsu
          git -C drivers/kernelsu checkout "$KSU_TAG"
          echo "KSU: $(git -C drivers/kernelsu describe --tags)"
          # non-GKI: KSU ma ist cez manualne ksu_handle_* hooky, ktore Floppy uz ma v fs/*.c,
          # nie cez kprobes. Vypneme vsetky kprobe hooky v KSU.
          find drivers/kernelsu/kernel -type f \( -name '*.c' -o -name '*.h' \) \
            -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: SUSFS hooky do KernelSU (10_enable, na v0.9.5 sadne na 0 rejectov)
        working-directory: kernel
        run: |
          cd drivers/kernelsu
          patch -p1 --batch --fuzz=3 -N < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ../..
          grep -q "KSU_SUSFS" drivers/kernelsu/kernel/Kconfig && echo "OK KSU_SUSFS" || \
            { echo "CHYBA: KSU_SUSFS Kconfig patch zlyhal"; exit 1; }

      - name: Oprava get_cred_rcu (Floppy ma cred.usage = atomic_long_t)
        working-directory: kernel
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/fix_cred_rcu.py"

      - name: Zapni KSU/SUSFS v defconfigu (non-GKI bezpecna sada)
        working-directory: kernel
        run: |
          # mnt_id_reorder a SUS_SU na non-GKI zamerne VYNECHANE (bootloop / nepodporovane).
          DC="arch/arm64/configs/$DEFCONFIG"
          sed -i '/^CONFIG_KSU/d;/^CONFIG_TMPFS_XATTR=y/d' "$DC"
          cat >> "$DC" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_TMPFS_XATTR=y
          EOF

      - name: Build kernelu
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_USER=claude KBUILD_BUILD_HOST=github-actions
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G
          MA=(O=out ARCH=arm64 "CC=ccache clang" LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-)
          make "${MA[@]}" "$DEFCONFIG"
          grep -q "CONFIG_KSU=y" out/.config || { echo "CHYBA: KSU nie je v .config"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS=y" out/.config || { echo "CHYBA: SUSFS nie je v .config"; exit 1; }
          make -j"$(nproc)" "${MA[@]}" KCFLAGS="-Wno-error"
          ls -la out/arch/arm64/boot/Image.gz

      - name: Zabal AnyKernel3 zip (willow anykernel.sh)
        run: |
          git clone --depth=1 "$ANYKERNEL" ak3
          rm -f ak3/Image* ak3/dtb* ak3/zImage* 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz ak3/
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > ak3/dtb 2>/dev/null || true
          cd ak3 && zip -r9 ../willow-KSU-SUSFS.zip . -x ".git*"

      - name: (volitelne) Vyrob hotovy boot.img
        if: ${{ github.event.inputs.stock_boot_url != '' }}
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v28.1.apk" -O magisk.apk || \
            wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -O magisk.apk
          unzip -o magisk.apk "lib/x86_64/*" -d magisk
          cp magisk/lib/x86_64/libmagiskboot.so ./magiskboot && chmod +x magiskboot
          curl -LSs "${{ github.event.inputs.stock_boot_url }}" -o stock-boot.img
          ./magiskboot unpack stock-boot.img
          cp kernel/out/arch/arm64/boot/Image.gz-dtb kernel 2>/dev/null || cp kernel/out/arch/arm64/boot/Image.gz kernel
          ./magiskboot repack stock-boot.img new-boot.img

      - name: Nahraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: willow-KSU-SUSFS
          path: |
            willow-KSU-SUSFS.zip
            new-boot.img

      - name: Vytvor prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-$(date +%Y%m%d)"
          cat > notes.md <<'EOF'
          ## NETESTOVANY, EXPERIMENTALNY BUILD

          Kernel pre **Redmi Note 8T (willow, SM6125)** na **PixelOS 17 (Android 17)** s **KernelSU + SUSFS**.

          - Build vygenerovany AI (Claude), **NEBOL otestovany na zariadeni**.
          - **NEFLASHUJ naslepo.** Najprv `fastboot boot new-boot.img`, az po overeni `fastboot flash boot`.
          - Vzdy si zalohuj stock `boot.img`.
          - KSU ide cez manualne hooky (non-GKI), kprobes su vypnute - log hlaska "KPROBES is disabled" je OCAKAVANA.
          - SUSFS non-GKI bootloop-prone funkcie (mnt_id_reorder, SUS_SU) su zamerne vypnute.
          - Autor ani siritel neruci za skody. Flashujes na vlastne riziko.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "willow KSU+SUSFS (netestovany build #${{ github.run_number }})" \
            --prerelease \
            --notes-file notes.md \
            willow-KSU-SUSFS.zip
          if [ -f new-boot.img ]; then
            gh release upload "$TAG" new-boot.img --repo "$GITHUB_REPOSITORY"
          fi
